.panel{width:min(92vw,410px);max-height:88vh;overflow:auto;padding:20px;background:#291d14;border:5px solid #855c38;box-shadow:0 0 0 5px #110b07}.panel h1{margin:0 0 10px;text-align:center;color:var(--gold)}.panel p{font-size:13px;line-height:1.45}

<script>
(()=>{
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],canvas=$('#game'),ctx=canvas.getContext('2d'),faceCanvas=$('#faceCanvas'),fctx=faceCanvas.getContext('2d');
const COST={warrior:1,archer:2,fireArcher:5,knight:6,tower:10,catapult:12,dragon:100,carpenter:10},NAMES=['John','Robert','William','Thomas','Henry','Edward','Arthur','Geoffrey','Richard','Edmund','Nigel','Cedric','Alfred','Hugh','Walter','Stephen','Roland','Percival','Godfrey','Oswald'],ADJ=['Bald','Smelly','Brave','Loud','Sleepy','Tiny','Crooked','Magnificent','Unwashed','Forgetful','Angry','Glorious','Nervous','Polite','Round','Lucky','Grim','Red','Stubborn','Merry'],GEAR=['cuffs','cape','helmet','jeweled weapon','boots','plume','shield badge','medal','gold trim','scar'];
let W=0,H=0,dpr=1,selected='warrior',commandMode=null,mana=4,keep=100,kills=0,elapsed=0,deployments=0,ended=false,started=false,crumbling=false,crumbleTime=0,last=performance.now(),manaTick=0,spawnTick=0,nextId=1;
let units=[],enemies=[],towers=[],shots=[],parts=[],audio=null,timer,musicOn=true,musicTimer=null,musicStep=0,playerName=localStorage.getItem('defendKeepPlayer')||'Andy',faceMood='normal',faceUntil=0,keepHitBurst=0;
const SKINS=['#e3aa78','#e3aa78','#e3aa78','#e3aa78','#d9b08c','#b9784e','#75452f','#4b2d21'];
const rnd=a=>a[Math.floor(Math.random()*a.length)],rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function react(mood,d=1){faceMood=mood;faceUntil=elapsed+d}
function speakTitle(){
 if(!audio)return;
 const now=audio.currentTime+.03;
 const syllables=[
  {f:150,d:.22,v:[['sawtooth',1],['square',.35]],noise:.09},   // de-
  {f:118,d:.28,v:[['sawtooth',1],['square',.28]],noise:.07},   // fend
  {f:165,d:.18,v:[['sawtooth',1],['square',.25]],noise:.05},   // the
  {f:105,d:.42,v:[['sawtooth',1],['square',.42]],noise:.1}     // keep
 ];
 let offset=0;
 for(const syl of syllables){
  for(const [type,mix] of syl.v){
   const o=audio.createOscillator(),g=audio.createGain(),bp=audio.createBiquadFilter();
   o.type=type;o.frequency.setValueAtTime(syl.f,now+offset);o.frequency.exponentialRampToValueAtTime(syl.f*.82,now+offset+syl.d);
   bp.type='bandpass';bp.frequency.setValueAtTime(type==='square'?1200:700,now+offset);bp.Q.value=3.5;
   g.gain.setValueAtTime(.0001,now+offset);g.gain.exponentialRampToValueAtTime(.09*mix,now+offset+.025);g.gain.exponentialRampToValueAtTime(.0001,now+offset+syl.d);
   o.connect(bp).connect(g).connect(audio.destination);o.start(now+offset);o.stop(now+offset+syl.d);
  }
  noise(syl.d*.65,syl.noise,offset+.02);
  offset+=syl.d*.88;
 }
 tone(95,.16,.025,-25,offset-.03,'square')
}

async function ready(){if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')await audio.resume();return audio}
function tone(f=220,d=.08,v=.04,slide=0,delay=0,type='square'){if(!audio)return;let t=audio.currentTime+delay,o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(35,f+slide),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+d)}
function noise(d=.06,v=.03,delay=0){if(!audio)return;let n=Math.max(1,audio.sampleRate*d),b=audio.createBuffer(1,n,audio.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;let s=audio.createBufferSource(),g=audio.createGain(),t=audio.currentTime+delay;s.buffer=b;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(g).connect(audio.destination);s.start(t)}
const sfx={slam(){noise(.16,.11);tone(85,.18,.1,-35);tone(55,.2,.07,-15,.03)},sword(){noise(.035,.025);tone(310,.045,.035,-120)},arrow(){tone(850,.09,.025,-500,0,'sine');noise(.025,.012)},hit(){noise(.045,.035);tone(120,.04,.022,-45)},death(){tone(180,.18,.035,-110,0,'sawtooth');noise(.07,.02,.04)},heal(){tone(520,.08,.018,120,0,'sine')},promote(){[520,660,820].forEach((f,i)=>tone(f,.11,.035,40,i*.07))},hero(){[260,390,520,780].forEach((f,i)=>tone(f,.16,.05,50,i*.1))},mana(){tone(740,.05,.012,90,0,'sine')},title(){[[262,0],[330,.08],[392,.16],[523,.27],[659,.39],[784,.52]].forEach(([f,d])=>{tone(f,.24,.065,35,d,'square');tone(f/2,.25,.025,10,d,'triangle')})},over(){[[330,0],[277,.23],[220,.46],[165,.69]].forEach(([f,d])=>{tone(f,.34,.065,-55,d,'sawtooth');tone(f/2,.38,.025,-20,d,'triangle')})},rock(){tone(95,.17,.06,-40,0,'square');noise(.11,.055)},fire(){noise(.18,.05);tone(180,.22,.04,-100,0,'sawtooth')},crumble(){noise(.45,.09);tone(75,.45,.08,-35,0,'square')}};
const melody=[523,659,784,659,587,698,880,698,659,784,988,784,587,698,880,698,523,659,784,988];
function musicPulse(){if(!audio||!musicOn||!started||ended||crumbling)return;let f=melody[musicStep%melody.length];tone(f,.12,.015,-8,0,'square');tone(f*2,.045,.006,-25,.025,'square');if(musicStep%2===0)tone(f/2,.15,.009,-5,0,'triangle');musicStep++}
function startMusic(){stopMusic();musicStep=0;if(musicOn)musicTimer=setInterval(musicPulse,235)}
function stopMusic(){if(musicTimer){clearInterval(musicTimer);musicTimer=null}}
function resize(){let r=canvas.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);canvas.width=r.width*dpr;canvas.height=r.height*dpr;W=r.width;H=r.height;ctx.setTransform(dpr,0,0,dpr,0,0)}window.addEventListener('resize',resize);
function select(t){selected=t;commandMode=null;$$('.unit').forEach(b=>b.classList.toggle('selected',b.dataset.type===t));$$('.strategy').forEach(b=>b.classList.remove('selected'))}
function chooseCommand(c){commandMode=c;$$('.strategy').forEach(b=>b.classList.toggle('selected',b.dataset.command===c));$$('.unit').forEach(b=>b.classList.remove('selected'));toast({formation:'FORMATION: tap near your troops',fallback:'FALL BACK: tap near your troops',help:'HELP: tap near a threatened area'}[c])}
$$('.unit').forEach(b=>b.onpointerdown=e=>{e.preventDefault();ready();select(b.dataset.type)});
$$('.strategy').forEach(b=>b.onpointerdown=e=>{e.preventDefault();ready();chooseCommand(b.dataset.command)});
function fmt(s){return `${Math.floor(s/60)}:${Math.floor(s%60).toString().padStart(2,'0')}`}
function burst(x,y,color,n=5,blood=false){for(let i=0;i<n;i++)parts.push({x,y,vx:rand(-60,60),vy:rand(-85,20),life:rand(.25,.65),color,size:blood?rand(2,4):3})}
function nearest(from,list,max=Infinity){let best=null,bd=max;for(const o of list){if(o.hp<=0)continue;let d=dist(from,o);if(d<bd){best=o;bd=d}}return best}
function toast(msg){let e=$('#hudUpdate');e.innerHTML=msg;e.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>e.classList.remove('show'),2600)}
function heroize(u){u.hero=true;u.name=`Sir ${rnd(NAMES)} the ${rnd(ADJ)}`;u.hp*=1.2;u.maxHp*=1.2;u.damage*=1.2;toast(`A HERO ARRIVES!<br><b>${u.name}</b>`);sfx.hero()}
function deploy(type,x,y){if(ended||mana<COST[type])return;if(type==='tower'&&towers.some(t=>dist(t,{x,y})<50))return;ready();mana-=COST[type];deployments++;x=clamp(x,23,W-23);y=clamp(y,H*.62,H-57);
if(type==='tower')towers.push({id:nextId++,type,x,y,hp:65,maxHp:65,range:180,rate:.9,damage:18,cool:0});
else if(type==='dragon'){units.push({id:nextId++,type,x,y:H-58,hp:999,maxHp:999,damage:95,speed:88,range:95,rate:3.5,cool:0,kills:0,level:0,gear:[],hero:false,dragon:true,born:elapsed});toast('THE DRAGON RIDER TAKES FLIGHT!');sfx.hero()}
else if(type==='carpenter'){units.push({id:nextId++,type:'carpenter',x:W/2,y:H+18,hp:5,maxHp:5,damage:0,speed:34,range:0,rate:0,cool:0,kills:0,level:0,gear:[],hero:false,recorded:false,born:elapsed,skin:rnd(SKINS),phase:'walking',work:0,anim:0});toast('A CARPENTER RUSHES TO THE KEEP!')}
else{let u=type==='warrior'?{id:nextId++,type,x,y,hp:18,maxHp:18,damage:5,speed:34,range:19,rate:.72,cool:0}:type==='archer'?{id:nextId++,type,x,y,hp:7,maxHp:7,damage:4,speed:25,range:125,rate:1.05,cool:0}:
type==='fireArcher'?{id:nextId++,type,x,y,hp:6,maxHp:6,damage:3.4,speed:23,range:120,rate:.78,cool:0,burnDamage:1.2,burnTime:3,splash:24}:type==='knight'?{id:nextId++,type,x,y,hp:29,maxHp:29,damage:8.8,speed:52,range:24,rate:.82,cool:0}:{id:nextId++,type:'catapult',x,y,hp:12,maxHp:12,damage:18,splash:58,speed:9,range:190,rate:.22,cool:0};Object.assign(u,{kills:0,level:0,gear:[],retreating:false,healing:false,hero:false,recorded:false,born:elapsed,target:null,wander:0,wanderAngle:0,anim:rand(0,1),skin:rnd(SKINS)});if(deployments%100===0)heroize(u);units.push(u);if(type==='fireArcher')toast('FIRE ARCHER: BURNING SPLASH DAMAGE')}burst(x,y,'#ffe08a',6);updateUI()}
function issueCommand(cmd,x,y){
 const nearby=units.filter(u=>!u.dragon&&u.type!=='carpenter'&&!u.healing&&u.hp>0&&Math.hypot(u.x-x,u.y-y)<=125);
 if(!nearby.length){toast('NO TROOPS CLOSE ENOUGH');return}
 if(cmd==='formation'){
  const melee=nearby.filter(u=>!['archer','fireArcher','catapult'].includes(u.type)),ranged=nearby.filter(u=>['archer','fireArcher','catapult'].includes(u.type));
  const place=(arr,rowY,spacing)=>arr.forEach((u,i)=>{u.commandTarget={x:clamp(x+(i-(arr.length-1)/2)*spacing,18,W-18),y:clamp(rowY,25,H-50)};u.commandHold=5;u.forcedTarget=null});
  place(melee,y-18,25);place(ranged,y+18,30);toast(`${nearby.length} TROOPS FORM RANKS!`);
 }else if(cmd==='fallback'){
  nearby.forEach((u,i)=>{u.commandTarget={x:clamp(W/2+(i-(nearby.length-1)/2)*20,20,W-20),y:H-50};u.commandHold=5;u.forcedTarget=null});toast(`${nearby.length} TROOPS FALL BACK!`);
 }else if(cmd==='help'){
  const threat=nearest({x,y},enemies,150);if(!threat){toast('NO ENEMY NEAR THAT POINT');return}
  nearby.forEach(u=>{u.forcedTarget=threat;u.commandTarget=null;u.commandHold=6});toast(`${nearby.length} TROOPS ANSWER THE CALL!`);
 }
 commandMode=null;$$('.strategy').forEach(b=>b.classList.remove('selected'));select(selected);
}
canvas.onpointerdown=e=>{e.preventDefault();let r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;if(commandMode)issueCommand(commandMode,x,y);else deploy(selected,x,y);$('#hint').style.opacity=0};
function spawn(){
 let scale=1+elapsed/75,r=Math.random(),type='raider';
 if(elapsed>330&&r<.012)type='enemyDragon';
 else if(elapsed>260&&r<.035)type='enemyCatapult';
 else if(elapsed>210&&r<.08)type='enemyKnight';
 else if(elapsed>170&&r<.105)type='enemyTower';
 else if(elapsed>22&&r<Math.min(.18+elapsed/1200,.29))type='enemyArcher';
 else if(r<Math.min(.30+elapsed/900,.43))type='berserker';

function drawKingFace(){let x=27,y=23,damage=100-keep,m=elapsed<faceUntil?faceMood:'normal';fctx.clearRect(0,0,54,48);fctx.fillStyle='#20150e';fctx.fillRect(2,1,50,46);fctx.fillStyle='#d2aa55';fctx.fillRect(5,4,44,40);fctx.fillStyle='#d8a071';fctx.fillRect(10,12,34,28);fctx.fillStyle='#7c4b29';fctx.fillRect(10,12,34,6);fctx.fillRect(7,17,5,18);fctx.fillRect(42,17,5,18);fctx.fillStyle='#f1cf63';fctx.fillRect(11,5,32,7);fctx.fillRect(14,1,6,7);fctx.fillRect(24,0,7,9);fctx.fillRect(36,1,6,7);fctx.fillStyle='#20130d';if(m==='wince'){fctx.fillRect(15,23,9,3);fctx.fillRect(31,23,9,3)}else{fctx.fillRect(17,22,5,5);fctx.fillRect(33,22,5,5)}if(damage>25){fctx.fillStyle='#493a5f';fctx.fillRect(29,19,12,10)}fctx.fillStyle='#5b241c';if(m==='smile'){fctx.fillRect(18,34,18,3);fctx.fillRect(21,37,12,3)}else if(m==='wince'){fctx.fillRect(18,37,18,3);fctx.fillRect(21,34,12,3)}else fctx.fillRect(20,35,14,3);if(damage>55){fctx.fillStyle='#fff0bb';fctx.fillRect(21,35,5,5);fctx.fillRect(31,35,5,5);fctx.fillStyle='#5b241c';fctx.fillRect(30,35,5,5)}if(damage>80){fctx.fillStyle='#9d1d24';fctx.fillRect(8,31,4,6)}$('#kingLabel').textContent='KING '+playerName.toUpperCase().slice(0,8)}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#6d9e55';ctx.fillRect(0,0,W,H);ctx.fillStyle='#628f4b';for(let y=20;y<H;y+=48)for(let x=(y/48%2)*20;x<W;x+=40)ctx.fillRect(x,y,3,7);ctx.fillStyle='#9b835b';ctx.fillRect(W*.32,0,W*.36,H);ctx.fillStyle='#aa9367';for(let y=15;y<H;y+=34)for(let x=W*.34;x<W*.66;x+=26)ctx.fillRect(x+((y/34)%2)*8,y,10,4);ctx.fillStyle='rgba(58,87,151,.14)';ctx.fillRect(0,H*.61,W,H*.39);ctx.fillStyle='#514235';ctx.fillRect(0,H-31,W,31);ctx.fillStyle='#8e7a64';for(let x=0;x<W;x+=36)ctx.fillRect(x,H-39,24,13);ctx.fillStyle='#2a211b';ctx.fillRect(W/2-22,H-31,44,31);ctx.fillStyle='#bf954a';ctx.fillRect(W/2-4,H-31,8,31);if(crumbling){let p=clamp(crumbleTime/1.8,0,1);ctx.fillStyle='#17100b';ctx.globalAlpha=p*.75;ctx.fillRect(0,H-45*p,W,45*p);ctx.globalAlpha=1;for(let i=0;i<35;i++){let rx=(i*47+crumbleTime*90)%W,ry=H-8-((i*31)%40)*p;ctx.fillStyle=i%2?'#756553':'#9b8870';ctx.fillRect(rx,ry,rand(5,13),rand(4,9))}}towers.forEach(towerDraw);units.forEach(u=>unitDraw(u));for(const u of units.filter(q=>q.healing)){let x=u.healerX??u.x,y=u.healerY??u.y+20,sway=u.healerReady?Math.sin(elapsed*7+u.id)*3:0;ctx.save();ctx.translate(x+sway,y);ctx.fillStyle='rgba(0,0,0,.2)';ctx.fillRect(-8,10,16,4);ctx.fillStyle='#f0ead8';ctx.fillRect(-7,-4,14,15);ctx.fillStyle=u.skin||'#c58f68';ctx.fillRect(-6,-13,12,9);ctx.fillStyle='#e7e7e7';ctx.fillRect(-7,-15,14,4);ctx.fillStyle='#c7252d';ctx.fillRect(-2,-2,4,10);ctx.fillRect(-5,1,10,4);ctx.fillStyle='#34241b';let healerStep=Math.floor(elapsed*5+u.id)%2;
 if(!u.healerReady&&healerStep){ctx.fillRect(-8,11,4,5);ctx.fillRect(3,10,4,6)}
 else{ctx.fillRect(-6,11,4,5);ctx.fillRect(2,11,4,5)}ctx.restore()}enemies.forEach(e=>unitDraw(e,true));for(const p of shots){if(p.kind==='boulder'){ctx.fillStyle='#675b51';ctx.fillRect(p.x-6,p.y-6,12,12)}else{ctx.strokeStyle=p.kind==='fire'?'#ff7b22':p.enemy?'#51241c':'#f4e1a0';ctx.lineWidth=p.kind==='fire'?3:2;ctx.beginPath();ctx.moveTo(p.x-p.vx*.025,p.y-p.vy*.025);ctx.lineTo(p.x,p.y);ctx.stroke();if(p.kind==='fire'){ctx.fillStyle='#ffd45b';ctx.fillRect(p.x-2,p.y-2,4,4)}}}for(const p of parts){ctx.globalAlpha=clamp(p.life*3,0,1);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.size,p.size)}ctx.globalAlpha=1;drawKingFace()}
function updateUI(){$('#mana').textContent=Math.floor(mana);$('#hp').textContent=Math.ceil(keep);$('#kills').textContent=kills;$('#time').textContent=fmt(elapsed);$('#deployed').textContent=deployments;let pct=clamp(keep,0,100),fill=$('#keepFill');fill.style.width=pct+'%';fill.style.background=pct>60?'#54b84a':pct>30?'#d3a937':'#cf3d35';$$('.unit').forEach(b=>b.disabled=mana<COST[b.dataset.type])}
function reset(){spawn.seen={};commandMode=null;mana=4;keep=100;kills=0;elapsed=0;deployments=0;ended=false;crumbling=false;crumbleTime=0;faceMood='normal';faceUntil=0;keepHitBurst=0;manaTick=0;spawnTick=0;units=[];enemies=[];towers=[];shots=[];parts=[];last=performance.now();select('warrior');updateUI()}
async function askName(){await ready();sfx.title();setTimeout(speakTitle,220);toast('DEFEND THE KEEP!');$('#start').disabled=true;setTimeout(()=>{$('#playerName').value=playerName;$('#nameScreen').classList.remove('hidden');$('#start').disabled=false;setTimeout(()=>$('#playerName').focus(),80)},1450)}function begin(){playerName=($('#playerName').value||'Andy').trim().slice(0,18)||'Andy';localStorage.setItem('defendKeepPlayer',playerName);$('#nameScreen').classList.add('hidden');reset();started=true;$('#title').classList.add('hidden');$('#over').classList.add('hidden');startMusic()}
function showHall(){let book=JSON.parse(localStorage.getItem('defendKeepHeroesV02')||'[]').sort((a,b)=>(b.kills||0)-(a.kills||0)).slice(0,10);localStorage.setItem('defendKeepHeroesV02',JSON.stringify(book));$('#heroList').innerHTML=book.length?book.map((h,i)=>`<div class="entry">${h.portrait?`<img src="${h.portrait}" alt="Portrait" style="width:64px;height:64px;image-rendering:pixelated;float:left;margin:0 10px 8px 0;border:3px solid #8d693d;background:#78925b">`:`<div style="width:64px;height:64px;float:left;margin:0 10px 8px 0;border:3px solid #8d693d;background:#78925b;display:grid;place-items:center;font-size:30px">⚔️</div>`}<b>#${i+1} ${h.name}</b><br>${h.kills} kills · ${h.date}${h.king?`<br>Proudly served King ${h.king}`:''}<small>${h.story}</small><div style="clear:both"></div></div>`).join(''):`<div class="empty">No heroes are recorded yet.<br><br>Every 100th deployment summons one.</div>`;$('#hall').classList.remove('hidden')}
$('#start').onpointerdown=askName;$('#nameGo').onpointerdown=begin;$('#playerName').addEventListener('keydown',e=>{if(e.key==='Enter')begin()});$('#again').onpointerdown=()=>{ready();reset();started=true;$('#over').classList.add('hidden');startMusic()};$('#backTitle').onpointerdown=()=>{stopMusic();started=false;$('#over').classList.add('hidden');$('#title').classList.remove('hidden')};$('#hallOpen').onpointerdown=()=>{ready();showHall()};$('#hallOver').onpointerdown=showHall;$('#hallClose').onpointerdown=()=>$('#hall').classList.add('hidden');let titleSoundDone=false;$('#title').addEventListener('pointerdown',async()=>{if(!titleSoundDone){await ready();sfx.title();setTimeout(speakTitle,160);titleSoundDone=true}},{once:true});
$('#manaStat').onpointerdown=async()=>{await ready();mana+=100;toast('SECRET TREASURY: +100 COINS');sfx.promote();updateUI()};
$('#musicToggle').onpointerdown=()=>{ready();musicOn=!musicOn;$('#musicToggle').classList.toggle('off',!musicOn);$('#musicToggle').textContent=musicOn?'♫':'♪';if(musicOn&&started&&!ended)startMusic();else stopMusic()};
let lastRenderError='';function loop(now){let dt=Math.min((now-last)/1000,.035);last=now;try{update(dt);draw();lastRenderError=''}catch(err){console.error(err);if(String(err)!==lastRenderError){lastRenderError=String(err);toast('DISPLAY ERROR: '+(err.message||'unknown'))}}requestAnimationFrame(loop)}resize();reset();requestAnimationFrame(loop);
})();
</script>
